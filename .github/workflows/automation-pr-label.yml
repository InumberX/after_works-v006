name: Automatically labeling pull request.

on:
  pull_request:
    types: [opened]

jobs:
  auto-labeling-pr:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      # ブランチのプレフィックスからラベル名を決める
      - name: Get label name
        id: label_name
        # HEAD_REF は PR 作成者が決められる。run: へ ${{ }} で直接展開すると
        # シェル起動前のテキスト置換になり、`$( )` などがコマンドとして実行される。
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          branch_type=${HEAD_REF%%/*}
          case "$branch_type" in
            feature) label_name=enhancement ;;
            bugfix|hotfix) label_name=bug ;;
            *) label_name='' ;;
          esac
          echo "label_name=$label_name" >> "$GITHUB_OUTPUT"

      # PRにラベルを付与する
      - name: Auto labeling
        if: ${{ steps.label_name.outputs.label_name != '' }}
        run: |
          gh pr edit '${{ github.event.pull_request.number }}' \
            --repo '${{ github.repository }}' \
            --add-label '${{ steps.label_name.outputs.label_name }}'
