name: Create release tag and release note.

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  create-release-tag:
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TZ: 'Asia/Tokyo'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 前回のリリースタグを取得する（1件も無ければ空）
      - name: Get previous tag
        id: pre_tag
        run: |
          pre_tag=$(gh release view \
            --repo '${{ github.repository }}' \
            --json tagName --jq .tagName 2>/dev/null || true)
          echo "pre_tag=$pre_tag" >> "$GITHUB_OUTPUT"

      # タグを生成する 「v{YYYY.MM.DD}-{当日リリース回数}」
      - name: Generate release tag
        id: release_tag
        run: |
          today=v$(date +'%Y.%m.%d')
          pre_tag='${{ steps.pre_tag.outputs.pre_tag }}'
          count=0

          # 同日の既存タグがあれば、その連番を引き継いで加算する
          if [ -n "$pre_tag" ] && [ "${pre_tag%%-*}" = "$today" ]; then
            count="${pre_tag##*-}"
            case "$count" in
              '' | *[!0-9]*) count=0 ;;
            esac
          fi

          echo "release_tag=$today-$((count + 1))" >> "$GITHUB_OUTPUT"

      # タグを切り、前回リリースからの差分でリリースノートを生成する
      # （カテゴリ分けは .github/release.yml の設定に従う）
      - name: Create release
        run: |
          gh release create '${{ steps.release_tag.outputs.release_tag }}' \
            --repo '${{ github.repository }}' \
            --title '${{ steps.release_tag.outputs.release_tag }}' \
            --target '${{ github.sha }}' \
            --generate-notes
